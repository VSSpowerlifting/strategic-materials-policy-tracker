# M2.7: manual-only DOE CMEI structured DOM source-admission audit.
# Not a collector: no cache, identity baseline, new policy or finance records.
name: SMPT DOE CMEI structured publisher validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smpt-doe-cmei-structured-admission
  cancel-in-progress: false

jobs:
  validate-publisher-template:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare structured DOE listing rows and original DOE article headers
        run: npm run monitor:probe-doe-structured
      - name: Archive source-only publisher diagnostics without creating monitor state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smpt-doe-structured-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .monitor-doe-structured/report.json
            .monitor-doe-structured/summary.md
          retention-days: 30
          if-no-files-found: warn
      - name: Show evidence boundaries
        if: always()
        run: |
          if test -s .monitor-doe-structured/summary.md; then
            cat .monitor-doe-structured/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "DOE publisher structure was not validated; no source admission." >> "$GITHUB_STEP_SUMMARY"
          fi
