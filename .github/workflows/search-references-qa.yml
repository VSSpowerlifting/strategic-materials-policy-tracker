name: Search reference downloads Chromium QA

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/search-references-qa.yml"
      - "scripts/qa-search-references-browser.mjs"
      - "lib/search-references.ts"
      - "lib/search-core.ts"
      - "lib/search.ts"
      - "components/search-explorer.tsx"
      - "app/search/**"
      - "lib/site.ts"
      - "data/seed/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: search-references-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/qa-search-references-browser.mjs
      - run: test -z "$(git status --porcelain)"
