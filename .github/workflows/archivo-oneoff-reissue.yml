name: One-off Archivo deck restyling

on:
  push:
    branches:
      - design/archivo-deck-editions-20261106

permissions:
  contents: write

jobs:
  restyle:
    if: contains(github.event.head_commit.message, '[deck-restyle-request]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install PDF export and weight-verified Archivo font tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fontconfig
          python -m pip install --upgrade pip
          python -m pip install fonttools pillow PyMuPDF
      - name: Restyle editable masters and create checked PDF exports
        run: python scripts/reissue_archivo_decks.py
      - name: Save rendered-review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smpt-archivo-reissue-review
          path: |
            docs/design/presentations/reviews/*-archivo-contact.jpg
            docs/design/presentations/reviews/ARCHIVO_REISSUE_QA_20261106.md
            public/research/fi001/presentation-v2-archivo.*
            public/research/fi002/executive-slides.*
          if-no-files-found: warn
          retention-days: 30
      - name: Commit verified presentation candidates back to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/financial-intelligence/hemerdon-phase1c/presentation-v2/SMPT_FI001_Hemerdon_Presentation_v2.pptx
          git add research/financial-intelligence/hemerdon-phase1c/presentation-v2/SMPT_FI001_Hemerdon_Presentation_v2.pdf
          git add docs/research/fi002-bhp-copper/output/SMPT_FI002_BHP_Copper_Strategy_Deck.pptx
          git add docs/research/fi002-bhp-copper/output/SMPT_FI002_BHP_Copper_Strategy_Deck.pdf
          git add public/research/fi001/ public/research/fi002/executive-slides.pptx public/research/fi002/executive-slides.pdf
          git add public/research/fi002/publication-manifest.json public/research/fi002/research-package.zip
          git add docs/design/presentations/reviews/
          git diff --cached --stat
          git diff --cached --quiet && exit 1
          git commit -m "Design: reissue FI001 and FI002 editable decks in Archivo"
          git push origin HEAD:${{ github.ref_name }}
