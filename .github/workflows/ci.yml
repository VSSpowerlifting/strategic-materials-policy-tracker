name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate data
        run: npm run validate

      # A pull request is compared with its merge base on the current target
      # branch, so only the PR's own changes count. github.event.pull_request.base.sha
      # is not refreshed when the target branch moves, and diffing from it counts
      # later target-branch commits as PR changes.
      - name: Editorial publication review gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            EDITORIAL_BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            EDITORIAL_BASE_SHA="$PUSH_BEFORE"
          fi
          export EDITORIAL_BASE_SHA
          echo "Editorial diff base: $EDITORIAL_BASE_SHA"
          npm run editorial:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
