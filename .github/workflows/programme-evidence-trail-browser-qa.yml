name: Programme evidence trail Chromium QA

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/programme-evidence-trail-browser-qa.yml"
      - "scripts/qa-programme-evidence-trail-browser.mjs"
      - "app/programmes/[id]/page.tsx"
      - "components/programme-research-trail.tsx"
      - "lib/programme-research-trail.ts"
      - "components/programmes-explorer.tsx"
      - "lib/source-usage.ts"
      - "data/seed/**"
      - "app/globals.css"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: programme-evidence-trail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-evidence-trails:
    name: Source and capital pathway navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/qa-programme-evidence-trail-browser.mjs
      - run: test -z "$(git status --porcelain)"
