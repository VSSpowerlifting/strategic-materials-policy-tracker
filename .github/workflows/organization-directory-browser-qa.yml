name: Organization directory Chromium QA

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/organization-directory-browser-qa.yml"
      - "scripts/qa-organizations-browser.mjs"
      - "app/organizations/**"
      - "components/organizations-explorer.tsx"
      - "lib/organization-directory.ts"
      - "lib/capital-intelligence.ts"
      - "data/seed/**"
      - "app/globals.css"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: organization-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-organizations:
    name: Browser organization roles and keyboard links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/qa-organizations-browser.mjs
      - run: test -z "$(git status --porcelain)"
