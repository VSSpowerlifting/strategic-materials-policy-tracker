# Shadow-source observation only. Runs on default branch after the PR is merged.
# No writes to published data or private candidate records. GITHUB_TOKEN is read-only.
# Cache is best-effort; if it disappears we restore a prior GitHub Actions state
# artifact (read-only), otherwise fail closed rather than silently re-baseline.
# No edits to published data or candidate records.
name: SMPT source-monitor pilot

on:
  workflow_dispatch:
    inputs:
      recover_from_artifact:
        description: "Skip cache and exercise archived identity recovery (requires a prior M1.2 run)"
        type: boolean
        required: false
        default: false
  schedule:
    # Daily 13:17 UTC; schedule delivery can be delayed by GitHub.
    - cron: "17 13 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: smpt-shadow-source-pilot
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore best-effort prior publication identities
        if: inputs.recover_from_artifact != true
        uses: actions/cache/restore@v4
        with:
          path: .monitor-pilot/state.json
          key: smpt-shadow-monitor-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            smpt-shadow-monitor-v1-

      - name: Check whether a prior identity ledger was restored
        id: prior
        run: |
          if test -s .monitor-pilot/state.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Using prior identity ledger from Actions cache."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Actions cache did not provide prior identity ledger; checking previous run artifacts."
          fi

      - name: Find latest archived state if cache was lost
        id: locate-state
        if: steps.prior.outputs.present == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'source-monitor-pilot.yml',
              branch: 'main', per_page: 50
            });
            for (const run of result.data.workflow_runs) {
              if (run.id === context.runId || run.status !== 'completed') continue;
              const list = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100
              });
              const name = `smpt-monitor-state-${run.id}-${run.run_attempt}`;
              const artifact = list.data.artifacts.find(a => a.name === name && !a.expired);
              if (!artifact) continue;
              core.setOutput('run_id', String(run.id));
              core.setOutput('artifact_name', name);
              core.info(`Found identity ledger from prior run ${run.id}, attempt ${run.run_attempt}.`);
              return;
            }
            core.warning('No recoverable monitoring state artifact among the previous 50 main-branch runs; execution will fail closed.');

      - name: Recover prior state from read-only Actions artifact
        if: steps.prior.outputs.present == 'false' && steps.locate-state.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.locate-state.outputs.artifact_name }}
          run-id: ${{ steps.locate-state.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .monitor-pilot

      - name: Observe registered official sources (no publication)
        env:
          SMPT_MONITOR_REQUIRE_PRIOR_STATE: "1"
        run: npm run monitor:pilot

      - name: Preserve observation identities even when a source is blocked
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-pilot/state.json
          key: smpt-shadow-monitor-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive identity ledger for cache-loss recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smpt-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .monitor-pilot/state.json
          retention-days: 30
          if-no-files-found: warn

      - name: Archive source health and public publication metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smpt-source-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .monitor-pilot/report.json
            .monitor-pilot/summary.md
            .monitor-pilot/editorial-review-queue.json
            .monitor-pilot/editorial-review-queue.csv
          retention-days: 30
          if-no-files-found: warn

      - name: Summarize evidence, without publishing it
        if: always()
        run: |
          if test -f .monitor-pilot/summary.md; then
            cat .monitor-pilot/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Monitor produced no valid report; source health not verified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail visibly on degraded sources, after evidence is archived
        run: |
          node -e 'const r=require("./.monitor-pilot/report.json"); if (!r.allSourcesHealthy || r.sources.some(s=>s.possibleWindowGap)) { console.error("SMPT shadow monitor degraded or finite feed rolled over; inspect artifact, do not treat as clean."); process.exit(1); }'
